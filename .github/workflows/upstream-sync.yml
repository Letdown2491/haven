# 7) Upstream Sync action (`.github/workflows/upstream-sync.yml`)

This keeps your `master` aligned with `bitvora/haven` and rebases your `feature/whitelist-owner` branch automatically.

```yaml
name: Upstream Sync
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/bitvora/haven.git || true
          git fetch upstream

      - name: Fast-forward master
        run: |
          git checkout master
          git merge --ff-only upstream/master || git merge --no-edit upstream/master
          git push origin master

      - name: Rebase whitelist branch
        run: |
          git checkout feature/whitelist-owner
          git rebase master
          git push --force-with-lease origin feature/whitelist-owner

